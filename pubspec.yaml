
name: todoapp
description: "A new Flutter project."
# The following line prevents the package from accidentally being published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by a +.
# Both the version and the builder number may be overridden by Flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts of the product and build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to the latest versions on pub.dev.
# Alternatively, dependencies can be manually updated by changing the version numbers below to the latest versions on pub.dev.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  video_player: ^2.10.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The following adds the Flutter Lints package to your project.
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and build_runner.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this package, see
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  assets:
    - lib/assets/videos/pink_sparkling_water.mp4
    - lib/assets/images/bioluminescent_plankton.jpeg

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one of several resolution-specific variants.
  # See https://flutter.dev/to/resolution-aware-images

  # For details regarding adding custom assets, see
  # https://flutter.dev/to/asset-from-package